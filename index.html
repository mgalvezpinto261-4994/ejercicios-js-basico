<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consumir API</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Personaje Rick and Morty</h1>
        <button id="btnPersonaje">Mostrar personaje</button>
        <div id="resultado"></div>

        <hr>


        <h1>Datos del usuario</h1>
        <div id="usuario">
            <p><strong>Nombre:</strong> <span id="nombreUsuario"></span></p>
            <p><strong>Email:</strong> <span id="emailUsuario"></span></p>
            <p><strong>Teléfono:</strong> <span id="telefonoUsuario"></span></p>
        </div>

        <hr>


        <h1>Frase aleatoria</h1>
        <button id="btnFrase">Generar frase</button>
        <div id="fraseResultado"></div>

    </div>

    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
